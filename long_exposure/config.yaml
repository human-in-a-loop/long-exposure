# config.yaml

# === Model ===
llm_provider: claude                  # claude | codex | gemini | local (local is an unsupported extension point)
model: opus                          # alias (sonnet, opus, haiku) or full name
codex_model: gpt-5.5                  # used when llm_provider: codex unless agent overrides model
gemini_model: gemini-3-flash-preview  # used when llm_provider: gemini unless agent overrides model
local_model: custom-local-model        # operator-supplied OpenAI-compatible model alias
local_base_url: http://127.0.0.1:18080/v1
local_context_window: 32768           # operator-supplied local context budget
local_max_tokens: 2048
local_recent_log_pct: 0.25            # inject at most 25% of context as recent per-agent transcript
local_compact_max_tokens: 4096        # cap local compaction summaries
local_temperature: 0.2
local_top_p: 0.95
context_window: 1000000
codex_context_window: 400000          # Codex compacts at 90% of this value (360k)
gemini_context_window: 1000000        # Gemini CLI free-tier docs advertise a 1M context window
codex_yolo: true                      # run codex exec --yolo by default (bypass approvals/sandbox like claude -p)
gemini_yolo: true                     # run gemini --yolo by default for autonomous headless turns
gemini_auth_env: GOOGLE_GENAI_USE_GCA # default Google-account / Code Assist auth selector
gemini_auth_value: "true"
codex_subagents:
  max_threads: 3                      # cap concurrent Codex subagent threads
  max_depth: 1                        # direct children only; no recursive subagent trees
model_tier: opus

# === Per-agent LLM routing (centralized template) ===
# Single source of truth for the provider, model, and effort of EACH agent
# type. Edit here to route different roles to different providers/models — e.g.
# a Claude Fable researcher at xhigh effort alongside a Codex worker at medium.
# See docs/configuration-reference.md (Per-agent LLM routing).
#
# Precedence: a field set here overrides the score's per-agent value and the
# global settings above; a field left unset falls back to them (so `provider:`
# omitted => `llm_provider`; `model:` omitted => the provider's default model
# — `model`/`codex_model`/`gemini_model`/`local_model`).
#
# provider: claude | codex | gemini | local
# model:    provider alias or full id (claude: opus|fable|sonnet|claude-opus-4-8;
#           codex: gpt-5.5; gemini: gemini-3-flash-preview; ...)
# effort:   low | medium | high | xhigh | max  (canonical vocabulary)
#   - claude: passed as `--effort`
#   - codex:  mapped to `-c model_reasoning_effort=` (max -> xhigh)
#   - gemini: mapped to settings.json thinkingLevel LOW|MEDIUM|HIGH (best-effort;
#             see docs/gaps.md — Gemini has no CLI effort flag)
#   - local:  advisory only (surfaces in the system prompt)
#
# Default: Claude Opus for every agent, at each role's preset effort
# (researcher / worker / auditor / final_auditor / manager = high; reporter /
# final_reporter / curator = medium). Delete this whole block to fall back
# entirely to the global settings + the score's per-agent effort (fully
# backward compatible).
#
# NOTE: heterogeneous providers (more than one distinct provider across agents)
# pin each agent to its provider and DEFER multi-account pooling for the run —
# see docs/multi-account-pool.md.
agent_models:
  researcher:     { provider: claude, model: opus, effort: high }
  worker:         { provider: claude, model: opus, effort: high }
  auditor:        { provider: claude, model: opus, effort: high }
  reporter:       { provider: claude, model: opus, effort: medium }
  final_auditor:  { provider: claude, model: opus, effort: high }
  final_reporter: { provider: claude, model: opus, effort: medium }
  manager:        { provider: claude, model: opus, effort: high }
  curator:        { provider: claude, model: opus, effort: medium }
cli_timeout: 0                       # seconds per claude -p call (0 = no timeout)
provider_idle_timeout_seconds: 1800  # no-progress hold before killing a silent provider CLI (0 = disabled)
provider_idle_poll_seconds: 10       # provider watchdog poll interval

# === Claude transport (opt-in) ===
# headless (default): one `claude -p` subprocess per turn — unchanged behavior,
#   all advanced features (multi-account pooling, parallel fan-out) intact.
# interactive: route Claude turns through a persistent interactive session so
#   they draw on the included Max subscription instead of the metered Agent-SDK
#   credit pool that `claude -p` uses from 2026-06-15. Claude-only; codex/gemini
#   are unaffected. Defers pooling + parallel fan-out (sequential cycles).
#   See docs/gaps_interactive_mode.md. Env override: LONG_EXPOSURE_CLAUDE_TRANSPORT.
claude_transport: headless           # headless | interactive
interactive_driver_model: sonnet     # model for the lightweight driver loop
interactive_permission_mode: skip    # skip (--dangerously-skip-permissions, like --yolo) | scoped
interactive_recycle_turns: 40        # relaunch the stateless driver every N turns to bound context
interactive_fetch_window_seconds: 30 # bridge long-poll window before the driver re-polls
interactive_turn_timeout_seconds: 1800  # max wait for one interactive turn's response

# === Pricing (optional, USD per 1M tokens) ===
# Used only to ESTIMATE cost for providers whose CLI reports none (Codex,
# Gemini, local). Claude `claude -p` envelopes carry `total_cost_usd`, which
# is recorded as-is and never re-estimated. Keys are provider -> model (exact
# id, a prefix, or `_default`). Fields: input, output, cache_read, cache_write.
# Leave empty to report cost as "n/a" for those providers.
# pricing:
#   codex:
#     gpt-5.5: {input: 1.25, output: 10.0, cache_read: 0.125}
#   gemini:
#     _default: {input: 0.0, output: 0.0}
pricing: {}

# === Compact ===
compact_threshold: 0.90
reanchor_enabled: true
compact_db: ./data/sessions.db
max_summary_pct: 0.15

# Run memoir — the L1 tier of narrative memory (docs/tiered-memory-plan.md).
# A single agent-owned file, MEMOIR.md, that the auditor updates with
# minimal edits at the end of each cycle and the researcher and worker
# receive as the `run_memory` input at the start of the next. Advisory:
# the plan of record and promise ledger win on any conflict. Superseded
# versions are archived under memoir/history/ and as record_type=memoir
# rows in sessions.db, never injected.
memoir:
  enabled: true
  max_tokens: 3000   # global cap enforced at injection (chars/4 estimate)
depth_compression: gentle

# === Total spend limit — OPT-IN ONLY. DEFAULT: NO CAP. ===
#
# There is NO spend limit unless you deliberately turn one on. That is the
# intended stance, not a placeholder: long-exposure is built to run on a
# FIXED-COST SUBSCRIPTION (a Max plan, via `claude -p`), where the marginal
# dollar cost of a run is zero and a per-run cap therefore buys you nothing.
# What it CAN do is truncate a run mid-cycle for no benefit. Leave it off
# unless you have a specific reason.
#
# Reasons someone might turn it on: metered API billing instead of a
# subscription, a shared account where one run must not monopolise capacity,
# or an unattended experiment whose blast radius you want bounded.
#
# The startup gate asks about this every launch (Q4) so the option is
# discoverable without editing this file — and the default answer is "no cap".
#
# When you DO turn it on: ONE total limit for the whole run, expressed as a
# percentage of a weekly allowance you declare. There are no per-agent,
# per-cycle or per-clone sub-budgets — the run spends freely against the
# total until it is gone.
#
# HONESTY NOTE: the harness cannot read real subscription usage. The `claude`
# CLI has no `usage` subcommand, `/usage` is interactive-only, and the `-p`
# envelope carries only total_cost_usd, token counts and num_turns. So
# `weekly_allowance_usd` is a number YOU declare, in API-equivalent dollars,
# and every surface that shows the cap says so. It is a proxy, not a meter
# reading.
#
# The delta semantics come for free: the ledger totals only this run's spend,
# so a cap measured from run start is already a delta on top of whatever you
# used before it — no need to know where you stand this week.
#
# Reaching the limit KILLS the run; it does not stop it gracefully. Clone
# process groups are swept, the end-of-run pipeline (final auditor, final
# reporter, curator) is SKIPPED, output/killed_spend_limit.json is written,
# and the process exits 3. State is still saved, so raising the limit and
# resuming works.
#
# `enabled: false`, `run_pct: 0`, or `weekly_allowance_usd: 0` all mean
# unlimited — and all three are the shipped defaults. Distinct from
# loop.max_cost_usd in the score, which is a graceful natural end-of-run and
# still runs the final stages.
usage_allowance:
  enabled: false
  weekly_allowance_usd: 0    # operator-declared, API-equivalent dollars
  run_pct: 0                 # 1-100; this run's delta against that allowance

# === Fan-out merge synthesis (Stage 2) ===
# When a parallel_cycle_fanout collapses with >= this many branches, the
# reporter agent is reused at the merge boundary to compress N raw
# merge_reports into one bounded synthesis (~15-30k tokens). This keeps
# the post-merge worker's context bounded as fan-out widens. Below the
# threshold, raw concatenation goes through unchanged (post-merge worker
# can handle 3 reports comfortably).
merge_synthesis_min_branches: 4

# === Agent Teams ===
# When enabled, agents whose score YAML flips `agent_teams: true` get
# CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 in their subprocess env and an
# <agent-teams> guidance block appended to the Operating Protocol section
# of their system prompt. Guidance is inheritance-based: the lead's model,
# effort, and token budget are injected as deterministic values and the
# lead is instructed to pass them verbatim to every teammate.
#
# `enabled: true` activates the feature. Per-agent `agent_teams: true` in
# the score YAML controls which roles can spawn teammates. In the current
# score, only `worker` and `auditor` set the per-agent flag; researcher,
# reporter, curator, and final_reporter run single-threaded.
# Depth is capped at 1 in the template: teammates must not spawn teammates.
agent_teams_defaults:
  enabled: true                            # master on/off (AND with per-agent flag)
  max_teammates: 3                         # hard cap injected into template
  allow_peer_messages: true                # teammates may SendMessage each other to collaborate during a team's lifetime
  cleanup_residue: true                    # Python-side sweep of tasks/<team>/ after each turn
  teammate_response_budget_tokens: 20000   # hard response-length cap passed to each teammate

# === Philosophy ===
philosophy: efficient

# === Framework ===
framework: staged

# === Protocol ===
checkpoint_format: standard
require_checkpoint_first: false
user_gate_approval: false
anti_patterns_enabled: true

# === Model capability profiles (opt-in) ===
# Thins the CEREMONY in the soft-guidance stack when the model running a turn
# is one you have declared advanced. The four-layer prompt was calibrated for
# Opus 4.6/4.7; for a more capable model the named anti-patterns, the
# nine-field checkpoint envelope and the per-stage exit-gate enumerations are
# a tax rather than a help.
#
# Resolved PER AGENT from the model `agent_models` routed that role to, so a
# Fable researcher can get the lean prompt while an Opus auditor in the same
# run keeps the full one.
#
# Sets only these four keys, and nothing else can be added to that list:
#   require_checkpoint_first, checkpoint_format, anti_patterns_enabled,
#   framework_verbosity (full | lean)
# Never touches philosophy text, the operating protocol's prescriptive rules,
# or role blocks — exhortation may thin, machinery may not.
#
# `enabled: false` (the default) applies nothing, and `profile: standard`
# applies nothing either, so a run that does not opt in gets a
# byte-identical prompt. Unknown model -> `default`, never a silent thinning.
# See docs/soft-guidance.md and docs/advanced-model-modes-plan.md.
model_profiles:
  enabled: false
  auto: true                 # derive the profile from the resolved model id
  profile: null              # explicit override: standard | advanced
  default: standard          # used when auto finds no family match
  families:
    advanced: [fable, astra] # case-insensitive substring match on the model id
  overrides: {}              # e.g. {anti_patterns_enabled: true} to re-add one

# === Startup gate (opt-in) ===
# Four questions asked ONCE, before a run begins, so the expensive choices
# are made deliberately instead of inherited from whatever this file says.
#   Q1 model     Q2 workspace     Q3 resume-or-fresh     Q4 spend limit
# Q4 appears only when usage_allowance.enabled is true.
#
# `launch` ONLY. `start`, `resume` and `python -m long_exposure.exploration`
# stay non-interactive, which is what keeps cron jobs, the fan-out clone
# spawn and the benchmark adapter working — a clone that stopped to ask a
# human which model to use would hang the barrier until the 10h cap.
#
# Answers persist to <instance_dir>/gate_answers.json and are re-applied on
# resume, so the gate never asks twice. A copy lands in the run's output/ for
# provenance. `launch --no-gate` skips it; --gate-model / --gate-workspace /
# --gate-resume / --gate-usage-pct pre-answer individual questions, so a
# fully-flagged launch is headless. A non-TTY with an unanswered question
# exits 4 and names the missing flag rather than guessing.
#
# Q1 rewrites the global `model` AND every agent_models entry still on the
# old global default, then prints the resulting routing table — the shipped
# config pins all eight roles, so setting `model` alone would change nothing,
# while overwriting all eight would destroy a deliberate heterogeneous
# routing (a Codex worker, a Sonnet reporter).
#
# Q3 lists runs from an append-only registry, falling back to a scan of
# instances_root for runs that predate it.
startup_gate:
  enabled: false
  model_choices: [opus, fable, sonnet]   # plus "other (type a value)"
  instances_root: ./instances            # fallback enumeration source for Q3
  registry_path: ~/.long-exposure/runs.jsonl
  max_runs_listed: 10

# === Permissions ===
# Directory the agent can access (absolute path, scopes file tools).
# File tools (Read, Write, Edit, Glob, Grep) are restricted to this path.
# Bash is NOT path-restricted by this setting — see operating protocol
# for soft directory boundaries enforced via instructions.
# Leave empty for no path restriction. Set to your project dir before
# running a real exploration.
working_directory: "/path/to/workspace"

# Command for Wolfram Language scripts. Leave empty if you don't have
# Wolfram installed — agents will be instructed not to use it.
# Use `wolfram-batch` when interactive `wolfram` works but `wolfram -script`
# or `wolframscript` fails in your environment. Set WOLFRAM_BIN if needed.
wolfram_path: "wolfram-batch"

# Tools allowed in non-interactive (-p) mode.
# File tools are automatically scoped to working_directory above.
# Bash accepts optional patterns: "Bash(npm test:npm run build)"
# Set the entire key to "dangerously_skip_all" to bypass all checks (not recommended).

allowed_tools:
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - Bash
  - WebSearch

# === Context Proximity ===
# Pre-ranks past sessions and injects the most relevant as "gems"
# into the system prompt at bootstrap. STANDALONE REPL ONLY
# (python -m long_exposure.orchestrator): the cycle loop does not inject
# gems, so these settings have no effect on a long-exposure run. See
# docs/persistence-and-gems.md.
context_proximity:
  enabled: true
  max_gems: 7                        # top N sessions to inject
  min_score: 0.3                     # ignore sessions below this score

# Relevance profiles keyed by philosophy name.
# Each profile defines how sessions are scored for that agent type.
# _same_topic / _same_subtopic: matched against the current session's catalog.
# _shared_tools: additive per shared tool.
# _any_topic: base score for all sessions (useful for research agents).
# Named topics/keywords: direct boost or penalty.
relevance_profiles:
  efficient:
    topic_weights:
      _same_topic: 1.0
      _same_subtopic: 0.5
      testing: -0.3
    tool_weights:
      _shared_tools: 0.3
    keyword_weights:
      breaking_change: 0.4
      constraint: 0.3
      silent_failure: 0.3

  research:
    topic_weights:
      _same_topic: 0.8
      _same_subtopic: 0.4
      _any_topic: 0.1
    tool_weights:
      _shared_tools: 0.4
    keyword_weights:
      constraint: 0.5
      rejected_approach: 0.5
      dead_end: 0.4
      surprising: 0.3

  audit:
    topic_weights:
      _same_topic: 1.0
      _same_subtopic: 0.6
    tool_weights:
      _shared_tools: 0.3
    keyword_weights:
      bug: 0.5
      silent_failure: 0.5
      regression: 0.4
      race_condition: 0.4
      breaking_change: 0.3

  reporter:
    topic_weights:
      _same_topic: 1.0
      _same_subtopic: 0.8
      _any_topic: 0.2
    tool_weights:
      _shared_tools: 0.2
    keyword_weights:
      design_decision: 0.5
      constraint: 0.4
      rejected_approach: 0.4
      dead_end: 0.3
      breaking_change: 0.3
      surprising: 0.3
